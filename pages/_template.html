<!doctype html>
<html lang="pt-br" class="tw-dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{title}}</title>
        <meta name="description" content="{{description}}" />
        <link rel="shortcut icon" href="../assets/images/home/logolc.png" type="image/x-icon" />
        <link rel="stylesheet" href="../css/tailwind-build.css">
        <link rel="stylesheet" href="../css/index.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
    </head>
    <body class="tw-flex tw-min-h-[100vh] tw-bg-[#fcfcfc] tw-text-black dark:tw-bg-black dark:tw-text-white">
        <main class="tw-flex tw-w-full tw-min-h-[100vh] tw-p-6 tw-gap-6">
            <aside class="tw-w-[260px] tw-min-h-full tw-bg-white dark:tw-bg-[#17181b] tw-rounded-xl tw-shadow-md tw-p-4">
                <div class="tw-flex tw-items-center tw-gap-3 tw-mb-4">
                    <img src="../assets/images/home/logolc.png" alt="logo" class="tw-h-8 tw-w-8 tw-object-contain">
                    <span class="tw-text-lg tw-font-semibold">LuxCut</span>
                </div>
                <nav class="tw-flex tw-flex-col tw-gap-2">
                    <a class="footer-link" href="agendamento.html">Agendamento automático</a>
                    <a class="footer-link" href="financeiro.html">Painel financeiro</a>
                    <a class="footer-link" href="bloqueio-horarios.html">Bloqueio de horários</a>
                    <a class="footer-link" href="servicos.html">Serviços</a>
                    <a class="footer-link" href="produtos.html">Adicionar produtos</a>
                    <div class="tw-h-[1px] tw-w-full tw-bg-gray-300 dark:tw-bg-gray-700 tw-my-2"></div>
                    <a class="footer-link" href="suporte.html">Canais de suporte</a>
                    <a class="footer-link" href="sistema.html">Sistema</a>
                    <a class="footer-link" href="sobre.html">Sobre</a>
                    <a class="footer-link" href="desenvolvedor.html">Desenvolvedor</a>
                    <div class="tw-h-[1px] tw-w-full tw-bg-gray-300 dark:tw-bg-gray-700 tw-my-2"></div>
                    <a class="footer-link" href="termos.html">Termos de serviço</a>
                    <a class="footer-link" href="privacidade.html">Política de privacidade</a>
                </nav>
            </aside>
            <section class="tw-flex-1 tw-min-h-full tw-bg-white dark:tw-bg-[#17181b] tw-rounded-xl tw-shadow-md tw-p-6 tw-flex tw-flex-col tw-gap-4">
                <h1 class="tw-text-4xl tw-font-semibold">{{title}}</h1>
                <p class="tw-text-gray-700 dark:tw-text-gray-300">{{intro}}</p>
                <div class="tw-grid tw-grid-cols-1 tw-gap-4">
                    <div class="tw-rounded-lg tw-border tw-border-gray-200 dark:tw-border-gray-700 tw-p-4">
                        <h2 class="tw-text-2xl tw-font-medium">{{section1_title}}</h2>
                        <p class="tw-text-gray-700 dark:tw-text-gray-300">{{section1_text}}</p>
                    </div>
                    <div class="tw-rounded-lg tw-border tw-border-gray-200 dark:tw-border-gray-700 tw-p-4">
                        <h2 class="tw-text-2xl tw-font-medium">{{section2_title}}</h2>
                        <p class="tw-text-gray-700 dark:tw-text-gray-300">{{section2_text}}</p>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
